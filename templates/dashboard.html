<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistem Rekapitulasi Absensi — Bidang Daskrimti</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-badge">⚖</div>
      <div>
        <p class="brand-eyebrow">KEJAKSAAN TINGGI JAWA TENGAH — BIDANG DASKRIMTI</p>
        <p class="brand-title">Sistem Rekapitulasi Absensi</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="dot-online"></span>
      <span>{{ user.email }}</span>
      <a href="{{ url_for('logout') }}" class="btn-keluar">Keluar</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <button class="nav-btn active" data-tab="beranda">🏠 Beranda</button>
      <button class="nav-btn" data-tab="proses">⬆️ Proses batch baru</button>
      <button class="nav-btn" data-tab="riwayat">🗂️ Riwayat batch</button>
      <button class="nav-btn" data-tab="cari">🔍 Cari pegawai</button>
      <button class="nav-btn" data-tab="visual">📈 Visualisasi</button>
      <button class="nav-btn" data-tab="log">🕒 Log aktivitas</button>
      <button class="nav-btn" data-tab="pengaturan">⚙️ Pengaturan</button>
    </nav>

    <main id="content" class="content">
      <p class="loading-text">Memuat...</p>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
